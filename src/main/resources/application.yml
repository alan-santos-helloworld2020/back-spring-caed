spring:
  datasource:
    url: jdbc:h2:mem:boletimdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8081

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
